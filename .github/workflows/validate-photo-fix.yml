name: Validate Photo Fix (No Deployment)

on:
  push:
    branches:
      - fix/vehicle-gallery-primary-photos
    paths:
      - '.github/workflows/validate-photo-fix.yml'
      - 'Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project/**'

permissions:
  contents: read

jobs:
  validate-gallery:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate test-only full inventory (no deployment)
        run: python feed_builder.py --output output/photo-fix-preview.jsonl.gz --min-vehicles 18
      - name: Compare proposed images to published feed
        run: |
          python - <<'PY'
          import gzip,io,json,requests
          from pathlib import Path
          with gzip.open('output/photo-fix-preview.jsonl.gz','rt',encoding='utf8') as f:
              proposed={r['item_id']:r for s in f if (r:=json.loads(s))}
          published='https://crownmotorspdx.github.io/crownmotors-inventory-feed/crown_inventory.jsonl.gz'
          response=requests.get(published,timeout=35,headers={'Cache-Control':'no-cache'})
          response.raise_for_status()
          with gzip.open(io.BytesIO(response.content),'rt',encoding='utf8') as f:
              old={r['item_id']:r for s in f if (r:=json.loads(s))}
          print('Currently published records:',len(old))
          print('Test-only records:',len(proposed))
          assert len(proposed)>=18
          assert set(proposed)==set(old), 'VIN mismatch; proposed feed must not be deployed'
          changed=[]
          for vin,row in proposed.items():
              previous=old[vin]
              if row['image_url']!=previous['image_url']:
                  changed.append(vin)
                  print('PHOTO CHANGED',vin,row['title'])
                  print(' OLD:',previous['image_url'])
                  print(' NEW:',row['image_url'])
              if row['url']!=previous['url']:
                  print('LISTING URL CHANGED ON WEBSITE:',vin)
                  print('  OLD:',previous['url'])
                  print('  NEW:',row['url'])
          print('Changed image count:',len(changed))
          print('Changed VIN suffixes:',[v[-5:] for v in changed])
          assert '1FT8W4DM1VEC05424' in changed, 'Silver Reserve video-preview selection was not corrected'
          assert proposed['1FT8W4DM6VEC01076']['image_url']==old['1FT8W4DM6VEC01076']['image_url'], 'Neptune Blue image unexpectedly changed'
          print('No changes were published. Review changed images before merge.')
          PY
