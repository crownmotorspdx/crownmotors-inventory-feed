name: Validate Video-Aware Photos (No Deployment)
on:
  push:
    branches:
      - fix/vehicle-gallery-primary-photos
    paths:
      - '.github/workflows/validate-video-photos.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate test feed without deployment
        run: python feed_builder.py --output output/video-photo-preview.jsonl.gz --min-vehicles 18
      - name: Compare all 22 VINs and image selections against live feed
        run: |
          python - <<'PY'
          import gzip,io,json,requests
          with gzip.open('output/video-photo-preview.jsonl.gz','rt',encoding='utf8') as f:
              proposed={r['item_id']:r for line in f if (r:=json.loads(line))}
          url='https://crownmotorspdx.github.io/crownmotors-inventory-feed/crown_inventory.jsonl.gz'
          response=requests.get(url,timeout=35,headers={'Cache-Control':'no-cache'})
          response.raise_for_status()
          with gzip.open(io.BytesIO(response.content),'rt',encoding='utf8') as f:
              current={r['item_id']:r for line in f if (r:=json.loads(line))}
          print('LIVE VEHICLES:',len(current),'TEST VEHICLES:',len(proposed))
          assert len(proposed)==22 and set(proposed)==set(current),'Vehicle count or VIN mismatch'
          changed=[]
          for vin,row in proposed.items():
              if row['image_url']!=current[vin]['image_url']:
                  changed.append(vin)
                  print('CHANGED PHOTO',vin,row['title'])
                  print(' OLD:',current[vin]['image_url'])
                  print(' NEW:',row['image_url'])
              if row['url']!=current[vin]['url']:
                  print('WEBSITE URL SLUG CHANGE',vin)
          print('CHANGED PHOTO COUNT:',len(changed))
          print('VIN SUFFIXES:',[vin[-5:] for vin in changed])
          assert '1FT8W4DM1VEC05424' in changed,'Verified Reserve exterior photo not selected'
          assert '1FT8W4DM6VEC01076' not in changed,'Neptune Blue should stay unchanged'
          assert len(changed)<=5,'Unexpected additional changed photos'
          print('PASS — NO FEED PUBLISHED; other changes require visual approval')
          PY
