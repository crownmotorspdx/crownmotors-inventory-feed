
name: Crown Motors Inventory Feed Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-inventory:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run validation tests
        run: python -m unittest discover -s tests -v


      - name: Diagnose website access
        run: |
          python - <<'PY'
          import requests
          from urllib.robotparser import RobotFileParser

          url = "https://www.crownmotorspdx.com/robots.txt"
          index = "https://www.crownmotorspdx.com/used-vehicles/?_exclude=condition"

          try:
              r = requests.get(url, timeout=20)
              print("HTTP status:", r.status_code)
              print("Final URL:", r.url)
              print("Content type:", r.headers.get("content-type"))
              print("Robots response:", repr(r.text[:1000]))

              r.raise_for_status()
              parser = RobotFileParser()
              parser.parse(r.text.splitlines())
              print("Inventory allowed:", parser.can_fetch("CrownMotorsPDX-InventoryFeed", index))
          except Exception as exc:
              print("Access diagnostic failed:", repr(exc))
              raise
          PY

      - name: Extract Crown Motors inventory
        run: python feed_builder.py --min-vehicles 18

      - name: Display inventory validation report
        run: |
          python - <<'PY'
          import gzip
          import json

          path = "output/crown_inventory.jsonl.gz"

          with gzip.open(path, "rt", encoding="utf-8") as file:
              vehicles = [json.loads(line) for line in file if line.strip()]

          print("TOTAL VEHICLES:", len(vehicles))
          print("")

          for number, vehicle in enumerate(vehicles, 1):
              print(f"VEHICLE {number}")
              print("VIN:", vehicle.get("item_id"))
              print("TITLE:", vehicle.get("title"))
              print("PRICE:", vehicle.get("price"))
              print("IMAGE:", vehicle.get("image_url"))
              print("LISTING:", vehicle.get("url"))
              print("AVAILABILITY:", vehicle.get("availability"))
              print("---")
          PY

      - name: Save test results
        uses: actions/upload-artifact@v4
        with:
          name: crown-inventory-test
          path: Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project/output/crown_inventory.jsonl.gz
          retention-days: 7
