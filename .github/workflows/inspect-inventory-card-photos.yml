name: Inspect Inventory Card Photo Mapping (Read Only)
on:
  push:
    branches: [fix/vehicle-gallery-primary-photos]
    paths: ['.github/workflows/inspect-inventory-card-photos.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Inspect inventory cards for VIN and lead photo (no publishing)
        working-directory: Crown_Motors_ChatGPT_Feed_Prototype/crown_feed_project
        run: |
          python - <<'PY'
          import requests,re,base64
          from urllib.parse import urljoin,urlparse
          from urllib.robotparser import RobotFileParser
          from bs4 import BeautifulSoup
          from feed_builder import BASE,INDEX,UA,extract_links,dealercenter_photo
          sess=requests.Session();sess.headers['User-Agent']=UA
          r=sess.get(BASE+'/robots.txt',timeout=20);r.raise_for_status()
          robots=RobotFileParser();robots.parse(r.text.splitlines())
          assert robots.can_fetch(UA,INDEX)
          r=sess.get(INDEX,timeout=30);r.raise_for_status()
          soup=BeautifulSoup(r.text,'html.parser')
          links=extract_links(r.text)
          print('INDEX LINKS:',len(links))
          for suffix in ('05424','10580','29383','18368','33816','01076'):
              match=next(((u,t) for u,t in links.items() if u.upper().rstrip('/').endswith(suffix)),None)
              print('\n=== VIN suffix',suffix,'match:',match,'===')
              if not match:continue
              path=urlparse(match[0]).path
              anchors=[a for a in soup.find_all('a',href=True) if urlparse(urljoin(BASE,a['href'])).path==path]
              print('NUM ANCHORS:',len(anchors))
              for a in anchors[:3]:
                  print(' ANCHOR:',a.get_text(' ',strip=True)[:120], 'PARENT:',a.parent.name if a.parent else '-')
                  for depth in (0,1,2,3,4):
                      node=a
                      for _ in range(depth):node=node.parent if node else None
                      if not node:continue
                      imgs=node.find_all('img',limit=5)
                      print('  DEPTH',depth,'IMGS:',[(im.get('alt','')[:80],im.get('src','')[:160]) for im in imgs[:3]])
                      if imgs:break
              for a in anchors[:1]:
                  node=a
                  for _ in range(5):node=node.parent if node else None
                  if not node:break
                  print(' CARD IMG DATA:',[(im.get('alt','')[:110],im.get('src','')[:220]) for im in node.find_all('img',limit=6)])
          PY
